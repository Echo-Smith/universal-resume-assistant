name: Validate skill

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile scripts
        env:
          PYTHONPYCACHEPREFIX: /tmp/ai-resume-assistant-pyc
        run: python -m py_compile skill/ai-resume-assistant/scripts/*.py
      - name: Check skill structure and references
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          root = Path("skill/ai-resume-assistant")
          skill = root / "SKILL.md"
          text = skill.read_text(encoding="utf-8")
          if not text.startswith("---\n"):
              raise SystemExit("SKILL.md is missing YAML frontmatter")
          frontmatter = text.split("---", 2)[1]
          for key in ("name:", "description:"):
              if key not in frontmatter:
                  raise SystemExit(f"SKILL.md frontmatter is missing {key}")
          for target in re.findall(r"\]\((references/[^)]+\.md)\)", text):
              if not (root / target).is_file():
                  raise SystemExit(f"Missing referenced file: {target}")
          print("Skill structure and references are valid")
          PY
      - name: Scan for obvious personal data
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          root = Path("skill/ai-resume-assistant")
          patterns = {
              "email": re.compile(r"(?<![\w.+-])[\w.+-]+@[\w-]+(?:\.[\w-]+)+"),
              "home_path": re.compile(r"(?:/Users/|/home/)[^\s\"']+"),
          }
          findings = []
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".md", ".yaml", ".py"}:
                  continue
              for i, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  for kind, pattern in patterns.items():
                      for match in pattern.finditer(line):
                          findings.append(f"{path}:{i}: {kind}: {match.group(0)}")
          if findings:
              print("\n".join(findings))
              raise SystemExit(1)
          print("No obvious personal data found in skill files")
          PY
      - name: Reject packaging metadata
        run: |
          if find skill -name '.DS_Store' -o -name '._*' -o -name '__MACOSX' -o -name '__pycache__' | grep -q .; then
            echo "Forbidden generated or operating-system metadata found"
            exit 1
          fi
